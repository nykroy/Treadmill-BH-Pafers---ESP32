; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags = 
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  h2zero/NimBLE-Arduino@2.5.2
  bblanchon/ArduinoJson@7.4.1

; IP 192.168.218.61/24, gateway 192.168.218.1; edit Wi-Fi in src/wifi_config.h.
; POST scan/connect return 202; GET /api/status supplies progress and devices.
; Protocol reference: qdomyos-zwift/src/devices/paferstreadmill.
; Pafers uses no checksum. Fractional TX is experimental; time/distance estimated.